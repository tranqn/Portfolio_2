<section id="home" class="hero">
  <div class="hero__inner">
    <div class="hero__copy">
      <p class="eyebrow" appReveal [revealDelay]="0">{{ 'HERO.EYEBROW' | translate }}</p>
      <h1 class="hero__title" appReveal [revealDelay]="60">
        {{ 'HERO.TITLE_1' | translate }}<br />
        <em>{{ 'HERO.TITLE_2' | translate }}</em>
      </h1>
      <p class="hero__intro" appReveal [revealDelay]="140">{{ 'HERO.INTRO' | translate }}</p>
    </div>

    <div class="hero__desk">
      <div class="hero__profile" appReveal [revealDelay]="200">
        <figure class="polaroid">
          <picture class="polaroid__photo">
            <source [srcset]="portrait.webp" type="image/webp" />
            <img
              [src]="portrait.jpg"
              [width]="portrait.width"
              [height]="portrait.height"
              [alt]="'HERO.POLAROID_ALT' | translate"
              fetchpriority="high" />
          </picture>
          <img class="polaroid__frame" [src]="polaroidFrame" alt="" width="417" height="500" />
          <span class="polaroid__caption" aria-hidden="true">
            <span class="polaroid__caption-default">Nam :)</span>
            <span class="polaroid__caption-hover">Nam :D</span>
          </span>
        </figure>

        <div class="hero__identity">
          <p class="hero__name">Quóc Nam Tràn</p>
          <p class="hero__role">
            {{ 'HERO.ROLE' | translate }}<br />{{ 'HERO.STACK' | translate }}
          </p>
          <p class="hero__location">{{ 'HERO.LOCATION' | translate }}</p>
          <a routerLink="/" fragment="contact" class="hero__contact">
            {{ 'HERO.CONTACT_LINK' | translate }} <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>

      <app-hero-terminals class="hero__terminals" appReveal="window" [revealDelay]="260" />
    </div>

    <app-skills />
  </div>
</section>
