<section id="home" class="hero">
  <div class="hero__inner">
    <div class="hero__main">
      <div class="hero__aside">
        <picture class="hero__portrait" appReveal [revealDelay]="0">
          <source [srcset]="portrait.webp" type="image/webp" />
          <img
            [src]="portrait.png"
            [width]="portrait.width"
            [height]="portrait.height"
            [alt]="'HERO.PORTRAIT_ALT' | translate"
            fetchpriority="high" />
        </picture>
      </div>

      <div class="hero__content">
        <div class="hero__copy">
          <p class="hero__eyebrow" appReveal [revealDelay]="40">Quóc Nam Tràn</p>
          <h1 class="hero__title" appReveal [revealDelay]="60">
            <span class="hero__line" appSweep [sweepDelay]="450">{{ 'HERO.ROLE' | translate }}</span>
          </h1>
          <p class="hero__intro" appReveal [revealDelay]="140">{{ 'HERO.INTRO' | translate }}</p>
          <p class="hero__location" appReveal [revealDelay]="180">{{ 'HERO.LOCATION' | translate }}</p>

          <div class="hero__actions" appReveal [revealDelay]="220">
            <a routerLink="/" fragment="projects" class="pill-link pill-link--primary">
              {{ 'HERO.CTA_PROJECTS' | translate }}
            </a>
            <a class="pill-link" [href]="cvFile()" download>
              {{ 'HERO.CTA_CV' | translate }}
              <span class="pill-link__meta">{{ 'HERO.CV_META' | translate }}</span>
            </a>
          </div>
          <a routerLink="/" fragment="contact" class="hero__contact quiet-link" appReveal [revealDelay]="260">
            {{ 'HERO.CONTACT_LINK' | translate }}
          </a>
        </div>
      </div>
    </div>

    <app-skills />
  </div>
</section>
