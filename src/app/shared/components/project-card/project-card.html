<div [id]="'project-' + project().id" class="project-card">
  <div class="project-card__image-wrapper">
    <span class="project-card__tape project-card__tape--a" aria-hidden="true"></span>
    <span class="project-card__tape project-card__tape--b" aria-hidden="true"></span>
    <span class="project-card__bracket project-card__bracket--tl" aria-hidden="true"></span>
    <span class="project-card__bracket project-card__bracket--tr" aria-hidden="true"></span>
    <span class="project-card__bracket project-card__bracket--bl" aria-hidden="true"></span>
    <span class="project-card__bracket project-card__bracket--br" aria-hidden="true"></span>

    <div class="project-card__image-clip">
      <div class="project-card__chrome-bar" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      @if (project().featured) {
        <img src="img/shared/featured.png" alt="Featured" class="project-card__featured">
      }
      <div class="project-card__image-inner" [class.project-card__image-float]="project().featured">
        <img [src]="project().image" [alt]="project().title + ' Project'" class="project-card__image">
      </div>
      <a [routerLink]="'/projects/' + project().id" class="project-card__hover-link">
        <span class="project-card__hover-button">{{ 'PROJECTS.PROJECT_DETAILS' | translate }}</span>
      </a>
      <span class="project-card__caption">{{ project().title | translate }}</span>
    </div>
  </div>
  <div class="project-card__content">
    <h3 class="project-card__title">{{ project().title | translate }}</h3>
    <p class="project-card__description">{{ project().description | translate }}</p>
    <app-cta-button
      class="project-card__mobile-cta"
      [translateKey]="'PROJECTS.PROJECT_DETAILS'"
      [route]="'/projects/' + project().id"
      variant="light" />
  </div>
</div>
