<article class="project-card">
  <app-mac-window [title]="project().title | translate" [compact]="true">
    <div class="project-card__media">
      <img
        [src]="project().media?.poster ?? project().image"
        [width]="project().media?.width ?? 640"
        [height]="project().media?.height ?? 320"
        alt=""
        loading="lazy"
        decoding="async" />
    </div>
  </app-mac-window>
  <h4 class="project-card__title">
    <a [routerLink]="'/projects/' + project().id" class="project-card__link">
      {{ project().title | translate }}
    </a>
  </h4>
  <p class="project-card__tech">{{ techKey() | translate }}</p>
  <p class="project-card__more" aria-hidden="true">{{ 'SHOWCASE.LINK_DETAILS' | translate }} →</p>
</article>
