<section id="colleagues" class="colleagues" aria-labelledby="colleagues-heading">
  <header class="colleagues__head" appReveal>
    <p class="eyebrow">{{ 'COLLEAGUES.LABEL' | translate }}</p>
    <h2 id="colleagues-heading" class="colleagues__title">{{ 'COLLEAGUES.TITLE' | translate }}</h2>
  </header>

  <ul class="colleagues__list">
    @for (colleague of colleagueDataService.allColleagues(); track colleague.name; let i = $index) {
      <li class="colleagues__card" appReveal [revealDelay]="i * 80">
        <figure>
          <blockquote class="colleagues__quote">
            <p>{{ colleague.textKey | translate }}</p>
          </blockquote>
          <figcaption class="colleagues__author">
            <span class="colleagues__name">{{ colleague.name }}</span>
            <span class="colleagues__position">{{ colleague.positionKey | translate }}</span>
            <a
              [href]="colleague.linkedInUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="colleagues__profile">
              {{ 'COLLEAGUES.PROFILE' | translate }}<span class="sr-only">: {{ colleague.name }}</span>
              <span aria-hidden="true">↗</span>
            </a>
          </figcaption>
        </figure>
      </li>
    }
  </ul>
</section>
