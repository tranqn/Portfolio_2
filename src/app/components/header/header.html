<a class="skip-link" href="#main-content">{{ 'HEADER.SKIP' | translate }}</a>

<header class="header">
  <nav class="header__pill liquid-glass liquid-glass--solid" [attr.aria-label]="'HEADER.NAV_LABEL' | translate">
    <a routerLink="/" class="header__brand" (click)="goHome($event)">
      <span aria-hidden="true">Nam</span>
      <span class="sr-only">{{ 'HEADER.HOME' | translate }}</span>
    </a>

    <ul class="header__links">
      @for (item of navItems; track item.fragment) {
        <li>
          <a routerLink="/" [fragment]="item.fragment" class="header__link" (click)="goTo($event, item.fragment)">
            {{ item.key | translate }}
          </a>
        </li>
      }
    </ul>

    <button
      type="button"
      class="header__lang"
      [attr.lang]="translationService.currentLang() === 'de' ? 'en' : 'de'"
      [attr.aria-label]="'HEADER.LANG_SWITCH_LABEL' | translate"
      (click)="translationService.switchLanguage()">
      <span aria-hidden="true">{{ translationService.currentLang() === 'de' ? 'EN' : 'DE' }}</span>
    </button>

    <button
      #menuButton
      type="button"
      class="header__menu-button"
      aria-controls="header-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()">
      {{ (menuOpen() ? 'HEADER.MENU_CLOSE' : 'HEADER.MENU') | translate }}
    </button>
  </nav>

  @if (menuOpen()) {
    <div id="header-menu" class="header__menu">
      <ul>
        @for (item of navItems; track item.fragment) {
          <li>
            <a routerLink="/" [fragment]="item.fragment" class="header__menu-link" (click)="goTo($event, item.fragment)">
              {{ item.key | translate }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
